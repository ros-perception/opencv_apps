PACKAGE = "opencv_apps"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()
gen.add("use_camera_info", bool_t, 0, "Indicates that the camera_info topic should be subscribed to to get the default input_frame_id. Otherwise the frame from the image message will be used.", False)

gen.add("threshold_step", double_t, 0, "Step of the thresholds from min_threshold to max_threshold", 10.0, 1.0, 255.0)
gen.add("min_threshold", double_t, 0, "The minimum threshold to binarize the image", 50.0, 0.0, 255.0)
gen.add("max_threshold", double_t, 0, "The maximum threshold (exclusive) to binarize the image", 220.0, 0.0, 255.0)
gen.add("min_repeatability", int_t, 0, "The minimum number of the binarized images in which a blob is detected", 2, 1, 255)
gen.add("min_dist_between_blobs", double_t, 0, "The blobs located closer than min_dist_between_blobs are merged", 10.0, 0.0, 1000.0)
gen.add("filter_by_color", bool_t, 0, "Filter the blobs by the color of the center", True)
gen.add("blob_color", int_t, 0, "0 to extract dark blobs and 255 to extract light blobs", 255, 0, 255)
gen.add("filter_by_area", bool_t, 0, "Filter the blobs by the area", True)
gen.add("min_area", double_t, 0, "The minimum area (inclusive) of the blobs [pixel]", 25.0, 0.0, 1000000.0)
gen.add("max_area", double_t, 0, "The maximum area (exclusive) of the blobs [pixel]", 100000.0, 0.0, 1000000.0)
gen.add("filter_by_circularity", bool_t, 0, "Filter the blobs by the circularity (4*pi*area/perimeter^2)", False)
gen.add("min_circularity", double_t, 0, "The minimum circularity (inclusive) of the blobs", 0.8, 0.0, 1.0)
gen.add("max_circularity", double_t, 0, "The maximum circularity (exclusive) of the blobs, 1.0 means no limit", 1.0, 0.0, 1.0)
gen.add("filter_by_inertia", bool_t, 0, "Filter the blobs by the inertia ratio (the minimum / maximum second central moment, the square of minor axis / major axis for an ellipse, 0: line, 1: circle)", False)
gen.add("min_inertia_ratio", double_t, 0, "The minimum inertia ratio (inclusive) of the blobs", 0.1, 0.0, 1.0)
gen.add("max_inertia_ratio", double_t, 0, "The maximum inertia ratio (exclusive) of the blobs, 1.0 means no limit", 1.0, 0.0, 1.0)
gen.add("filter_by_convexity", bool_t, 0, "Filter the blobs by the convexity (area / area of convex hull)", False)
gen.add("min_convexity", double_t, 0, "The minimum convexity (inclusive) of the blobs", 0.95, 0.0, 1.0)
gen.add("max_convexity", double_t, 0, "The maximum convexity (exclusive) of the blobs, 1.0 means no limit", 1.0, 0.0, 1.0)

exit(gen.generate(PACKAGE, "blob_detection", "BlobDetection"))
