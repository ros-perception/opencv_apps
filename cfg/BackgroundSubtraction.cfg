#! /usr/bin/env python

PACKAGE = "opencv_apps"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("use_camera_info", bool_t, 0, "Indicates that the camera_info topic should be subscribed to to get the default input_frame_id. Otherwise the frame from the image message will be used.", False)
method = gen.enum([gen.const("MOG2", int_t, 0, "Gaussian mixture model (video module)"),
                   gen.const("KNN",  int_t, 1, "K-nearest neighbours (video module)"),
                   gen.const("MOG",  int_t, 2, "Gaussian mixture model (the bgsegm module of opencv_contrib)"),
                   gen.const("GMG",  int_t, 3, "Godbehere-Matsukawa-Goldberg (the bgsegm module of opencv_contrib)"),
                   gen.const("CNT",  int_t, 4, "Counting (the bgsegm module of opencv_contrib)"),
                   gen.const("GSOC", int_t, 5, "Google Summer of Code 2017 (the bgsegm module of opencv_contrib)"),
                   gen.const("LSBP", int_t, 6, "Local SVD Binary Pattern (the bgsegm module of opencv_contrib)")],
                  "An enum for background subtraction methods")
gen.add("method", int_t, 0, "Background subtraction method, 0: MOG2, 1: KNN, 2: MOG, 3: GMG, 4: CNT, 5: GSOC, 6: LSBP (MOG, GMG, CNT, GSOC and LSBP need the bgsegm module of opencv_contrib, otherwise MOG2 is used)", 0, 0, 6, edit_method=method)
gen.add("learning_rate", double_t, 0, "Learning rate of the background model, negative: automatically chosen, 0: not updated, 1: reinitialized from the last frame (CNT, GSOC and LSBP may still update the model at 0, and GMG, GSOC and LSBP do not reinitialize it at 1)", -1.0, -1.0, 1.0)

gen.add("mog2_history", int_t, 0, "MOG2: Length of the history", 500, 1, 5000)
gen.add("mog2_var_threshold", double_t, 0, "MOG2: Threshold on the squared Mahalanobis distance between the pixel and the model to decide whether a pixel is well described by the background model", 16.0, 1.0, 256.0)
gen.add("mog2_detect_shadows", bool_t, 0, "MOG2: Detect shadows and mark them (127) in the foreground mask", True)
gen.add("mog2_nmixtures", int_t, 0, "MOG2: Number of Gaussian components in the background model (recreates the model)", 5, 1, 10)

gen.add("knn_history", int_t, 0, "KNN: Length of the history", 500, 1, 5000)
gen.add("knn_dist2_threshold", double_t, 0, "KNN: Threshold on the squared distance between the pixel and the sample to decide whether a pixel is close to that sample", 400.0, 1.0, 5000.0)
gen.add("knn_detect_shadows", bool_t, 0, "KNN: Detect shadows and mark them (127) in the foreground mask", True)

gen.add("mog_history", int_t, 0, "MOG: Length of the history", 200, 1, 5000)
gen.add("mog_nmixtures", int_t, 0, "MOG: Number of Gaussian mixtures, at most 8 by OpenCV (recreates the model)", 5, 1, 8)
gen.add("mog_background_ratio", double_t, 0, "MOG: Background ratio", 0.7, 0.0, 1.0)
gen.add("mog_noise_sigma", double_t, 0, "MOG: Noise strength, 0: automatic", 0.0, 0.0, 100.0)

gen.add("gmg_initialization_frames", int_t, 0, "GMG: Number of frames used to initialize the background models", 120, 1, 1000)
gen.add("gmg_decision_threshold", double_t, 0, "GMG: Threshold of the probability above which a pixel is foreground", 0.8, 0.0, 1.0)
gen.add("gmg_max_features", int_t, 0, "GMG: Total number of distinct colors to maintain in histogram (recreates the model)", 64, 1, 512)
gen.add("gmg_quantization_levels", int_t, 0, "GMG: Number of discrete levels in each channel to be used in histograms (recreates the model)", 16, 1, 128)
gen.add("gmg_background_prior", double_t, 0, "GMG: Prior probability that any given pixel is a background pixel", 0.8, 0.0, 1.0)
gen.add("gmg_smoothing_radius", int_t, 0, "GMG: Kernel size of the median filter to clean up the foreground mask, 0 (no filter) or odd", 7, 0, 31)

gen.add("cnt_min_pixel_stability", int_t, 0, "CNT: Number of frames with same pixel color to consider stable", 15, 1, 1000)
gen.add("cnt_max_pixel_stability", int_t, 0, "CNT: Maximum allowed credit for a pixel in history", 900, 1, 10000)
gen.add("cnt_use_history", bool_t, 0, "CNT: Give a pixel credit for being stable for a long time", True)

gen.add("gsoc_n_samples", int_t, 0, "GSOC: Number of samples to maintain at each point of the frame (recreates the model)", 20, 2, 100)
gen.add("gsoc_replace_rate", double_t, 0, "GSOC: Probability of replacing the old sample (recreates the model)", 0.003, 0.0, 1.0)
gen.add("gsoc_propagation_rate", double_t, 0, "GSOC: Probability of propagating to neighbors (recreates the model)", 0.01, 0.0, 1.0)
gen.add("gsoc_hits_threshold", int_t, 0, "GSOC: How many positives the sample must get before it will be considered as a possible replacement (recreates the model)", 32, 1, 1000)

gen.add("lsbp_n_samples", int_t, 0, "LSBP: Number of samples to maintain at each point of the frame (recreates the model)", 20, 2, 100)
gen.add("lsbp_radius", int_t, 0, "LSBP: Radius of the LSBP descriptor (recreates the model)", 16, 1, 64)
gen.add("lsbp_threshold", int_t, 0, "LSBP: Threshold of the LSBP descriptor distance (recreates the model)", 8, 0, 32)
gen.add("lsbp_min_count", int_t, 0, "LSBP: Minimal number of matches for a pixel to be background (recreates the model)", 2, 1, 100)

exit(gen.generate(PACKAGE, "background_subtraction", "BackgroundSubtraction"))
