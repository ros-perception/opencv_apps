PACKAGE = "opencv_apps"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()
gen.add("use_camera_info", bool_t, 0, "Indicates that the camera_info topic should be subscribed to to get the default input_frame_id. Otherwise the frame from the image message will be used.", False)
match_type = gen.enum([gen.const("TM_SQDIFF",        int_t, 0, "Sum of Squared Differences (lower is better)"),
                       gen.const("TM_SQDIFF_NORMED", int_t, 1, "Normalized Sum of Squared Differences (lower is better)"),
                       gen.const("TM_CCORR",         int_t, 2, "Cross Correlation"),
                       gen.const("TM_CCORR_NORMED",  int_t, 3, "Normalized Cross Correlation"),
                       gen.const("TM_CCOEFF",        int_t, 4, "Correlation Coefficient"),
                       gen.const("TM_CCOEFF_NORMED", int_t, 5, "Normalized Correlation Coefficient")],
                      "An enum for Matching Methods")
gen.add("match_method", int_t, 0, "Matching Method, 0: TM_SQDIFF, 1: TM_SQDIFF_NORMED, 2: TM_CCORR, 3: TM_CCORR_NORMED, 4: TM_CCOEFF, 5: TM_CCOEFF_NORMED", 5, 0, 5, edit_method=match_type)
gen.add("match_threshold", double_t, 0, "Minimum similarity of a match, the score of TM_CCORR_NORMED and TM_CCOEFF_NORMED, 1 - score of TM_SQDIFF_NORMED; not used by the methods which are not normalized", 0.0, 0.0, 1.0)
gen.add("max_matches", int_t, 0, "Maximum number of the matches. 1: the best match only, more than 1: the matches above match_threshold, after a non-maximum suppression", 1, 1, 100)

exit(gen.generate(PACKAGE, "match_template", "MatchTemplate"))
