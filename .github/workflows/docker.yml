# Build the docker images of OpenCV with CUDA and opencv_apps (docker/cuda, docker/opencv5-cuda), for use_cuda:=true of
# the launch files of the dnn nodes, and publish them on the GitHub Container Registry as
# ghcr.io/<owner>/opencv_apps:cuda and :opencv5-cuda (and :cuda-<commit>, :opencv5-cuda-<commit>) on the push to indigo.
# The layers of OpenCV are cached in the registry (:cuda-cache, :opencv5-cuda-cache), so a push rebuilds only opencv_apps;
# the first build of OpenCV with CUDA takes hours on the runner.
name: docker

on:
  push:
    branches: [indigo]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cuda
            dockerfile: docker/cuda/Dockerfile
          - tag: opencv5-cuda
            dockerfile: docker/opencv5-cuda/Dockerfile
    steps:
      - name: Free the disk of the runner for the images of CUDA
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The name of the image (in lower case, as the registry needs)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencv_apps" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=opencv_apps with OpenCV built with CUDA (${{ matrix.tag }})
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:${{ matrix.tag }}-cache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:${{ matrix.tag }}-cache,mode=max
