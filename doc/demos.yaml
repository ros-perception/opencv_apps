# How the demo of each node of the documentation is made, for "Try it with the demo video" of the pages of the nodes
# (doc/tools/generate_pages.py). The clip is published as image at 10 Hz by image_publisher, and the node is run by
# its launch file with launch_args.
#   clip: the input video, a clip on the docs-media branch (media/clips/ of the documentation, 960x540), or test/*.mp4
#   image: the remapping of the input, instead of image:=image
#   launch_args: the arguments of the launch file (launch_file, or the node)
#   prepare: the commands before publishing the clip, steps: the commands after running the node
#   view: the image topic of the node to view, instead of image
#   downloads, publisher, view_command: the files to download, the command to publish them and to view the result,
#     instead of the clip, image_publisher and rqt_image_view
adding_images:
  clip: tos_bridge.mp4
  image: image1:=image image2:=image2
  launch_args:
    alpha: 0.5
    approximate_sync: true
    gamma: 0.0
  note: image1 is tos_bridge.mp4 and image2 is pool.mp4, both 960x540.
  prepare:
  - 'wget https://ros-perception.github.io/opencv_apps/media/clips/pool.mp4  # image2'
  steps:
  - ros2 run image_publisher image_publisher_node pool.mp4 --ros-args -p publish_rate:=10.0 -r image_raw:=image2 -r camera_info:=camera_info2
    &
aruco_detection:
  clip: test/codes.mp4
  launch_args:
    marker_length: 0.05
    use_camera_info: true
background_subtraction:
  clip: pool.mp4
  launch_args:
    method: 0
    node_name: background_subtraction_mog2
  note: MOG2; the camera is fixed and the balls move.
barcode_detection:
  clip: test/codes.mp4
blob_detection:
  clip: ballpit.mp4
  image: image:=hsv_color_filter/image
  launch_args:
    min_area: 200.0
  note: The input is the mask of the yellow balls of hsv_color_filter.
  steps:
  - ros2 launch opencv_apps hsv_color_filter.launch.xml h_limit_min:=40 h_limit_max:=70 s_limit_min:=150 s_limit_max:=255
    v_limit_min:=120 v_limit_max:=255 &
camshift:
  clip: tos_canal.mp4
  launch_args:
    height: 220
    node_name: camshift_roi
    width: 160
    x: 300
    y: 160
  note: The ROI is the man, as the other tracking nodes; camshift tracks the hue histogram of the ROI, and the ellipse
    also takes the areas of the same hue; back_project and image are shown.
compare_histogram:
  clip: street.mp4
  launch_args:
    histogram_comparison_type: 3
    histogram_size: 32
    node_name: compare_histogram_color
    reference_histogram: '"$H"'
  note: The reference histogram is that of the first frame of the clip, as test/ros2/test_compare_histogram.py.
  prepare:
  - 'H=$(python3 -c "import cv2; img = cv2.VideoCapture(''street.mp4'').read()[1]; print([round(float(v), 6) for c in range(3)
    for v in cv2.normalize(cv2.calcHist([img], [c], None, [32], [0, 256]), None, 0, 1, cv2.NORM_MINMAX).flatten()])")  # the
    reference histogram of the first frame'
contour_moments:
  clip: pool_zoom.mp4
convex_hull:
  clip: pool_zoom.mp4
  launch_args:
    threshold: 20
corner_harris:
  clip: tos_bridge.mp4
  launch_args:
    threshold: 120
  note: The threshold is lowered from 200 to show more corners.
discrete_fourier_transform:
  clip: street.mp4
detection_3d:
  clip: test/rgbd_walking.mp4
  downloads:
  - test/publish_rgbd.py
  - test/rgbd_walking.mp4
  - test/rgbd_walking_depth.npz
  publisher: python3 publish_rgbd.py rgbd_walking.mp4 rgbd_walking_depth.npz
  image: input:=/dnn_object_detection/detections depth:=depth camera_info:=camera_info
  launch_args: {}
  steps:
  - ros2 launch opencv_apps dnn_object_detection.launch.xml image:=image &
  view_command: ros2 run rviz2 rviz2 -d $(ros2 pkg prefix --share opencv_apps)/rviz/detection_3d.rviz
  figure:
    path: images/detection_3d_pipeline.svg
    caption: 'The pipeline of detection_3d: the 2D results of the other nodes (replaceable by remapping input),
      the distances of an RGB-D camera or a LiDAR, and the 3D boxes, the markers and the TF frames of the objects.'
  note: 'The input is 20 RGB-D images of the TUM RGB-D freiburg3_walking_xyz sequence (image, depth in mm,
    camera_info and the colored points, by test/publish_rgbd.py, with the static TF of the camera on camera_link), and
    the objects of dnn_object_detection. rviz/detection_3d.rviz shows the points, ~/markers (the 3D boxes, the labels
    with the distances and the axes of the TF frames of the objects), the image of dnn_object_detection and the depth
    image; for your camera, give its frame by -f, e.g. -f camera_link, and the topics of the images by remapping, e.g.
    --ros-args -r /depth:=/camera/camera/aligned_depth_to_color/image_raw. rviz/detection_3d_ros1.rviz is the same
    for ROS 1.'
  variants_title: Inputs and sources of the distances
  variants_note: The 2D results of the other nodes and the distances of an RGB-D camera, a monocular depth estimation
    or a LiDAR, shown in rviz with rviz/detection_3d.rviz and rviz/detection_3d_lidar.rviz (the view of the objects
    farther away). The commands below are in their own terminals, as above.
  variants:
  - name: rgbd
    title: Objects and an RGB-D camera (default)
    default: true
    note: The depth image of the TUM RGB-D dataset, as above.
  - name: skeletons
    title: Human and hand skeletons
    image: input:=/dnn_pose_estimation/skeletons depth:=depth camera_info:=camera_info
    launch_args:
      input_type: skeletons
    commands:
    - python3 publish_rgbd.py rgbd_walking.mp4 rgbd_walking_depth.npz &
    - ros2 launch opencv_apps dnn_pose_estimation.launch.xml image:=image &
    - ros2 run rviz2 rviz2 -d $(ros2 pkg prefix --share opencv_apps)/rviz/detection_3d_skeletons.rviz &
    note: '``~/skeletons`` of dnn_pose_estimation (``person``) or dnn_hand_pose_estimation (``left_hand`` and
      ``right_hand``): the box and the TF frame of each skeleton as an object, the TF frame ``<label>_<id>_<keypoint>``
      of each keypoint (e.g. ``person_0_left_wrist``) at the median depth within ``keypoint_radius`` of the keypoint,
      and the joints and the bones in ``~/markers``; the keypoints less visible than ``keypoint_visibility`` are left
      out. Needs OpenCV 4.9 or later, as the pose nodes.'
  - name: mono
    title: Monocular depth estimation
    image: input:=/dnn_object_detection/detections depth:=/dnn_depth_estimation/depth camera_info:=camera_info
    commands:
    - python3 publish_rgbd.py rgbd_walking.mp4 rgbd_walking_depth.npz --ros-args -r depth:=unused_depth -r points:=unused_points &
    - ros2 launch opencv_apps dnn_depth_estimation.launch.xml image:=image metric_depth:=true input_width:=518 input_height:=518 model:=https://huggingface.co/k-okada/depth-anything-v2-metric-small-onnx/resolve/5494458701c7274fa82af484e2f2d226c948b54d/depth_anything_v2_metric_hypersim_vits_518.onnx &
    - ros2 launch opencv_apps dnn_object_detection.launch.xml image:=image &
    - ros2 run depth_image_proc point_cloud_xyzrgb_node --ros-args -r rgb/image_rect_color:=image -r rgb/camera_info:=camera_info -r depth_registered/image_rect:=/dnn_depth_estimation/depth &
    - ros2 run rviz2 rviz2 -d $(ros2 pkg prefix --share opencv_apps)/rviz/detection_3d.rviz --ros-args -r /depth:=/dnn_depth_estimation/depth &
    note: 'Only the color image of a camera: ``~/depth`` (32FC1 in m) of dnn_depth_estimation with Depth Anything V2
      Metric (indoors, see dnn_depth_estimation), instead of the depth of the RGB-D camera (not used, remapped to
      unused_depth), and its points by depth_image_proc for rviz. The distances are less accurate than those of an
      RGB-D camera (the relative error is about 0.15 on CUDA in this sequence), and the model needs OpenCV 4.10 or
      later, and a GPU to run it in real time.'
  - name: lidar
    title: LiDAR
    image: input:=/dnn_object_detection/detections points:=points camera_info:=camera_info
    launch_args:
      depth_source: points
      max_depth: 60.0
      depth_threshold: 1.0
      track_distance: 2.0
    commands:
    - wget https://raw.githubusercontent.com/ros-perception/opencv_apps/indigo/test/publish_lidar.py
    - wget https://raw.githubusercontent.com/ros-perception/opencv_apps/indigo/test/lidar_boreas.mp4
    - wget https://raw.githubusercontent.com/ros-perception/opencv_apps/indigo/test/lidar_boreas_points.npz
    - python3 publish_lidar.py lidar_boreas.mp4 lidar_boreas_points.npz &
    - ros2 launch opencv_apps dnn_object_detection.launch.xml image:=image &
    - ros2 run rviz2 rviz2 -d $(ros2 pkg prefix --share opencv_apps)/rviz/detection_3d_lidar.rviz &
    note: 20 images and the points of the LiDAR (in the frame lidar, with the static TF of the extrinsics from the
      frame camera) of the Boreas dataset, by test/publish_lidar.py; the objects are farther and move faster than
      indoors, so max_depth, depth_threshold and track_distance are larger.
dnn_depth_estimation:
  clip: keybridge.mp4
  variants_title: Models
  variants_note: The node runs MiDaS v2.1 small by default, whose output is the relative inverse depth
    (``~/inverse_depth``), or a model of the depth in meters (``metric_depth:=true``, ``~/depth``), e.g. Depth Anything
    V2 Metric, for detection_3d with a monocular camera. Depth Anything V2 Metric Small is converted to onnx readable by
    OpenCV 4.10 and later (by tools/export_depth_anything_metric.py) in
    `k-okada/depth-anything-v2-metric-small-onnx <https://huggingface.co/k-okada/depth-anything-v2-metric-small-onnx>`_
    (Apache-2.0).
  variants:
  - name: midas
    title: MiDaS v2.1 small (default)
    default: true
    note: 'MiDaS v2.1 small (256x256): fast on a CPU, and read by OpenCV 4 and 5; the relative inverse depth,
      larger nearer, without the scale in meters.'
  - name: hypersim
    title: Depth Anything V2 Metric Small, indoors (Hypersim)
    launch_args:
      model: https://huggingface.co/k-okada/depth-anything-v2-metric-small-onnx/resolve/5494458701c7274fa82af484e2f2d226c948b54d/depth_anything_v2_metric_hypersim_vits_518.onnx
      input_width: 518
      input_height: 518
      metric_depth: true
    note: 'Depth Anything V2 Metric Small trained on Hypersim (518x518, 99 MB): the depth in meters indoors, up to
      about 20 m, e.g. for detection_3d in a room; needs OpenCV 4.10 or later, and a GPU to run it in real time. The
      demo is the RGB-D sequence of TUM (its color images only).'
  - name: vkitti
    title: Depth Anything V2 Metric Small, outdoors (Virtual KITTI)
    launch_args:
      model: https://huggingface.co/k-okada/depth-anything-v2-metric-small-onnx/resolve/5494458701c7274fa82af484e2f2d226c948b54d/depth_anything_v2_metric_vkitti_vits_518.onnx
      input_width: 518
      input_height: 518
      metric_depth: true
    note: 'Depth Anything V2 Metric Small trained on Virtual KITTI (518x518, 99 MB): the depth in meters outdoors, up
      to about 80 m, e.g. on the road; needs OpenCV 4.10 or later.'
dnn_face_detection:
  clip: tos_faces.mp4
dnn_face_recognition:
  clip: test/face_detector_withface_test_diamondback.mp4
  launch_args:
    data_dir: /tmp/dnn_face_data
  note: Train a face with the trainer, which asks for the name, then the node recognizes it.
  steps:
  - ros2 run opencv_apps face_recognition_trainer.py --ros-args -r faces:=/dnn_face_recognition/output -r train:=/dnn_face_recognition/train
dnn_facial_expression_recognition:
  clip: tos_faces.mp4
dnn_hand_pose_estimation:
  clip: sign.mp4
  note: Needs OpenCV 4.9 or later; recorded with OpenCV 4.12 on CUDA.
dnn_image_classification:
  clip: tos_bridge.mp4
  variants_title: Models
  variants_note: The node runs the classification models of ImageNet with the same input (224x224, RGB normalized by
    the mean and the standard deviation of ImageNet) and output (the logits of the 1000 classes), given by ``model``.
    ImageNet has no class of the people, so the classes of this clip are the things around them.
  variants:
  - name: ppresnet50
    title: PP-ResNet50 (default)
    default: true
    note: 'The most accurate (top-1 82.3 % on ImageNet, 98 MB): use it unless the computer is slow, e.g. with a GPU
      or a desktop CPU.'
  - name: mobilenetv1
    title: MobileNetV1
    launch_args:
      model: https://github.com/opencv/opencv_zoo/raw/48b10fa505aeb51fbd127fc60a5c660040e823b7/models/image_classification_mobilenet/image_classification_mobilenetv1_2022apr.onnx
    note: 'MobileNetV1 of opencv_zoo (top-1 67.6 %, 16 MB, OpenCV 4.9 or later): much faster and smaller than
      PP-ResNet50, for a small computer without a GPU, e.g. a Raspberry Pi; MobileNetV2 is a little more accurate.'
  - name: mobilenetv2
    title: MobileNetV2
    launch_args:
      model: https://github.com/opencv/opencv_zoo/raw/48b10fa505aeb51fbd127fc60a5c660040e823b7/models/image_classification_mobilenet/image_classification_mobilenetv2_2022apr.onnx
    note: 'MobileNetV2 of opencv_zoo (top-1 69.4 %, 14 MB, OpenCV 4.9 or later): the more accurate of the two
      MobileNets at about the same speed, the first choice for a small computer.'
dnn_interactive_segmentation:
  clip: test/face_detector_withface_test_diamondback.mp4
  note: The box around the woman at the center is given with set_image.py, as the tracking nodes, and kept for the next
    images. EfficientSAM-Ti of opencv_zoo (Apache 2.0) needs OpenCV 4.10 or later.
  steps:
  - ros2 run opencv_apps set_image.py 375 325 150 310 --ros-args -r set_roi:=/dnn_interactive_segmentation/set_roi
dnn_object_detection:
  clip: tum_walking.mp4
  variants_title: Models
  variants_note: The node runs YOLOX (``model_type:=yolox``, onnx), by default YOLOX-S trained on COCO of opencv_zoo,
    NanoDet-Plus (``model_type:=nanodet``, onnx), the models of the output of YOLOv8, YOLOv9 and YOLO11
    (``model_type:=yolov8``, onnx, OpenCV 4.9 or later), or a model of ``cv::dnn::DetectionModel``
    (``model_type:=detection_model``), e.g. YOLO of darknet and SSD, with ``config``, ``classes``, ``input_width``,
    ``input_height``, ``scale`` and ``swap_rb``. All the models below are trained on the 80 classes of COCO.
  variants:
  - name: yolox
    title: YOLOX-S (default)
    default: true
    note: 'YOLOX-S of opencv_zoo (AP 40.5 on COCO, 36 MB, onnx): the first choice, accurate and fast enough on a
      GPU or a desktop CPU, and read by OpenCV 4 and 5.'
  - name: yoloxint8
    title: YOLOX-S int8
    launch_args:
      model: https://github.com/opencv/opencv_zoo/raw/48b10fa505aeb51fbd127fc60a5c660040e823b7/models/object_detection_yolox/object_detection_yolox_2022nov_int8.onnx
    note: 'YOLOX-S quantized to int8 of opencv_zoo (AP 32.6, 9 MB, onnx): a little less accurate, smaller and faster
      on a CPU without a GPU, e.g. a small computer of a robot; with CUDA, use YOLOX-S, as int8 runs on the CPU.'
  - name: yoloxtiny
    title: YOLOX-Tiny
    launch_args:
      model: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx
      input_width: 416
      input_height: 416
    note: 'YOLOX-Tiny of Megvii (AP 32.8 on COCO, 20 MB, onnx, Apache-2.0): smaller and faster than YOLOX-S, with the
      input 416x416, for a CPU of a robot; read by OpenCV 4 and 5.'
  - name: yoloxnano
    title: YOLOX-Nano
    launch_args:
      model: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
      input_width: 416
      input_height: 416
    note: 'YOLOX-Nano of Megvii (AP 25.8, 3.7 MB, onnx, Apache-2.0): the smallest YOLOX, for a small computer, e.g. a
      Raspberry Pi; misses small or blurred objects more than the others. Read by OpenCV 4 and 5.'
  - name: nanodet
    title: NanoDet-Plus
    launch_args:
      model_type: nanodet
      input_width: 416
      input_height: 416
    note: 'NanoDet-Plus-m-1.5x of opencv_zoo (AP 34.1, 3.8 MB, onnx, Apache-2.0): as accurate as YOLOX-Tiny in a fifth
      of its size, the first choice for a CPU without a GPU; read by OpenCV 4 (also 4.6 of Ubuntu 24.04) and 5.'
  - name: yolov8n
    title: YOLOv8n (AGPL-3.0)
    launch_args:
      model_type: yolov8
      model: https://github.com/CVHub520/X-AnyLabeling/releases/download/v0.1.0/yolov8n.onnx
    note: 'YOLOv8n of Ultralytics (AP 37.3, 13 MB, onnx, the URL of samples/dnn/models.yml of OpenCV): the most accurate
      of the small models; the models of Ultralytics are under AGPL-3.0, which applies to your system using them, so it
      is not the default. model_type yolov8 also reads YOLOv9 and YOLO11 exported to onnx (opset 12). OpenCV 4.9 or
      later.'
  - name: yolov4tiny
    title: YOLOv4-tiny (darknet)
    launch_args:
      model_type: detection_model
      model: https://github.com/AlexeyAB/darknet/releases/download/darknet_yolo_v4_pre/yolov4-tiny.weights
      config: https://raw.githubusercontent.com/AlexeyAB/darknet/59596d7880f6504768df41d6daa586f5cb2b932f/cfg/yolov4-tiny.cfg
      classes: https://raw.githubusercontent.com/AlexeyAB/darknet/59596d7880f6504768df41d6daa586f5cb2b932f/data/coco.names
      input_width: 416
      input_height: 416
    note: 'YOLOv4-tiny of darknet (AP 21.7 on COCO, 23 MB): the fastest and least accurate, and an example of
      darknet models, e.g. your own model trained with darknet; OpenCV 4 only, as OpenCV 5 reads only onnx.'
dnn_optical_flow:
  clip: keybridge.mp4
  note: Needs OpenCV 4.10 or later. RAFT takes about 1 s per image on a CPU (OpenCV 4.x runs it on the CPU), so the
    flows are of the images about 1 s apart, which the node processes, not of the consecutive images of the 10 Hz
    video. The model of opencv_zoo is under the BSD-3-Clause license (RAFT) and the MIT License (its conversion to
    onnx).
dnn_pose_estimation:
  clip: tos_bridge.mp4
  note: Needs OpenCV 4.9 or later; recorded with OpenCV 4.12 on CUDA.
dnn_semantic_segmentation:
  clip: tos_bridge.mp4
dnn_super_resolution:
  clip: test/face_detector_withface_test_diamondback.mp4
  variants_title: Models
  variants_note: The node runs the onnx models of `dnn_superres <https://github.com/opencv/opencv_contrib/tree/5.x/modules/dnn_superres>`_
    of opencv_contrib (in opencv_extra, OpenCV 4.10 or later), given by ``model``, whose scale is the scale of
    ``~/image``; the model enlarges the Y channel of YCrCb, and the colors (Cr and Cb) are enlarged by the bicubic
    interpolation. The models are converted from the TensorFlow models of
    `TF-ESPCN <https://github.com/fannymonori/TF-ESPCN>`_ and
    `FSRCNN_Tensorflow <https://github.com/Saafke/FSRCNN_Tensorflow>`_, both Apache-2.0 (opencv_extra, which has
    the onnx files, has no license file of its own). The input of this demo is 640x480.
  variants:
  - name: espcn_x2
    title: ESPCN x2 (default)
    default: true
    note: 'ESPCN x2 (86 KB): 2 times as large, e.g. 640x480 to 1280x960, the fastest.'
  - name: fsrcnn_x2
    title: FSRCNN x2
    launch_args:
      model: https://raw.githubusercontent.com/opencv/opencv_extra/697e5c3de828f3154e82f222dbe902d622bbe19a/testdata/cv/dnn_superres/FSRCNN_x2.onnx
    note: 'FSRCNN x2 (38 KB): 2 times as large, about as accurate as ESPCN x2 (the benchmark of dnn_superres) and
      slower.'
  - name: fsrcnn_x3
    title: FSRCNN x3
    launch_args:
      model: https://raw.githubusercontent.com/opencv/opencv_extra/697e5c3de828f3154e82f222dbe902d622bbe19a/testdata/cv/dnn_superres/FSRCNN_x3.onnx
    note: 'FSRCNN x3 (39 KB): 3 times as large, e.g. 640x480 to 1920x1440.'
dnn_text_detection:
  clip: test/text.mp4
dnn_tracking:
  clip: tos_canal.mp4
  note: Set the man on the first frame with set_image.py just after the video starts (the demo publishes the frames one by
    one and sets it at the start of each loop).
  prepare:
  - 'ffmpeg -i tos_canal.mp4 -frames:v 1 frame0.png  # the first frame'
  steps:
  - ros2 run opencv_apps set_image.py 300 160 160 220 frame0.png --ros-args -r set_roi:=/dnn_tracking/set_roi
edge_detection:
  clip: street.mp4
  launch_args:
