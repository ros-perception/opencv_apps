# the parameters of slam_toolbox of launch/odometry_tb3_simulation.launch.py: the map of the 2D LiDAR of TurtleBot3
# (3.5 m), with the odometry of laser_odometry or rgbd_odometry (odom -> base_footprint)
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 3.5
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    map_update_interval: 1.0
    transform_timeout: 0.5
    do_loop_closing: true
