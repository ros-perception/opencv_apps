# the parameters of slam_toolbox of launch/laser_odometry_slam.launch.xml: the map from the 2D scan of the points of
# the LiDAR on the floor plane of base_link, with the odometry of laser_odometry (odom -> base_link)
slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 30.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    map_update_interval: 1.0
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    do_loop_closing: true
